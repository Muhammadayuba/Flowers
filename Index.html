<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --violet: #7c3aed;
  --violet-light: #a78bfa;
  --violet-pale: #ede9fe;
  --sakura: #f9a8d4;
  --sakura-light: #fce7f3;
  --sakura-deep: #ec4899;
  --cream: #fdf8f0;
  --text-dark: #2d1b4e;
  --text-mid: #6b3fa0;
  --green: #4ade80;
  --green-dark: #16a34a;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family:'DM Sans',sans-serif;
  background:var(--cream);
  color:var(--text-dark);
  overflow-x:hidden;
}

/* PETALS */
.petal-canvas {
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  pointer-events:none; z-index:0; overflow:hidden;
}
.petal {
  position:absolute; top:-40px;
  font-size:1.1rem; opacity:0;
  animation:fall linear infinite;
}
@keyframes fall {
  0%   { transform:translateY(0) rotate(0deg) translateX(0); opacity:0.75; }
  100% { transform:translateY(110vh) rotate(400deg) translateX(40px); opacity:0; }
}

/* REVEAL */
.reveal { opacity:0; transform:translateY(28px); transition:opacity 0.65s ease, transform 0.65s ease; }
.reveal.visible { opacity:1; transform:translateY(0); }

/* NAV DOTS */
.nav-dots {
  position:fixed; right:20px; top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; gap:10px; z-index:100;
}
.nav-dot {
  width:8px; height:8px; border-radius:50%;
  background:rgba(167,139,250,0.3);
  border:1.5px solid rgba(167,139,250,0.5);
  cursor:pointer; transition:all 0.3s ease;
}
.nav-dot.active,.nav-dot:hover {
  background:var(--violet); border-color:var(--violet); transform:scale(1.35);
}

/* HERO */
.hero {
  min-height:100vh; display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
  padding:80px 5%; position:relative;
  background:linear-gradient(155deg,#fdf4ff 0%,#fce7f3 45%,#ede9fe 100%);
  overflow:hidden;
}
.hero::before {
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%,rgba(167,139,250,0.18) 0%,transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 70%,rgba(249,168,212,0.22) 0%,transparent 70%);
}
.hero-badge {
  font-size:0.72rem; font-weight:500; letter-spacing:0.22em;
  text-transform:uppercase; color:var(--sakura-deep);
  background:rgba(249,168,212,0.18); border:1px solid rgba(249,168,212,0.38);
  padding:6px 18px; border-radius:100px; margin-bottom:26px; position:relative;
}
.hero h1 {
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.8rem,8vw,6rem);
  font-weight:300; font-style:italic;
  line-height:1.1; color:var(--text-dark);
  margin-bottom:22px; position:relative;
}
.hero h1 span { color:var(--violet); }
.hero-sub {
  font-size:1rem; font-weight:300; color:var(--text-mid);
  max-width:500px; line-height:1.85; margin-bottom:48px; position:relative;
}
.scroll-hint {
  display:flex; flex-direction:column; align-items:center;
  gap:8px; font-size:0.7rem; letter-spacing:0.18em;
  text-transform:uppercase; color:var(--violet-light); position:relative;
}
.scroll-line {
  width:1px; height:46px;
  background:linear-gradient(to bottom,var(--violet-light),transparent);
  animation:pulse-line 2s ease-in-out infinite;
}
@keyframes pulse-line {
  0%,100%{opacity:0.35;}50%{opacity:1;}
}

/* SECTIONS */
section { padding:90px 8%; position:relative; z-index:1; }
.section-label {
  font-size:0.68rem; font-weight:500; letter-spacing:0.26em;
  text-transform:uppercase; color:var(--sakura-deep);
  margin-bottom:10px; text-align:center;
}
h2 {
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2rem,5vw,3.2rem);
  font-weight:400; font-style:italic;
  color:var(--text-dark); text-align:center;
  margin-bottom:12px; line-height:1.15;
}
.subtitle {
  text-align:center; color:var(--text-mid); font-weight:300;
  font-size:0.97rem; max-width:560px;
  margin:0 auto 50px; line-height:1.8;
}

/* ══════════════════════════════
   SVG FLOWER ILLUSTRATIONS
══════════════════════════════ */
.flower-illustration {
  width:100%; height:100%; display:block;
}

/* LILY SECTION */
.lily-section {
  background:linear-gradient(180deg,var(--cream) 0%,#f3e8ff 100%);
}
.flower-field {
  display:flex; justify-content:center;
  align-items:flex-end; gap:24px; flex-wrap:wrap;
}
.flower-field-item {
  position:relative; cursor:pointer; flex:0 0 auto;
}
.flower-stem-wrap {
  width:180px; height:260px;
  border-radius:200px 200px 40px 40px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(124,58,237,0.13);
  background:#f0fdf4;
  transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.4s ease;
  display:flex; align-items:center; justify-content:center;
}
.flower-field-item:nth-child(2) .flower-stem-wrap {
  width:220px; height:300px;
}
.flower-stem-wrap:hover {
  transform:translateY(-14px) scale(1.05);
  box-shadow:0 22px 52px rgba(124,58,237,0.22);
}
.flower-tag {
  position:absolute; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.9); backdrop-filter:blur(8px);
  border-radius:100px; padding:5px 14px;
  font-size:0.7rem; font-weight:500; letter-spacing:0.06em;
  color:var(--violet); white-space:nowrap;
  opacity:0; transition:opacity 0.3s ease;
}
.flower-field-item:hover .flower-tag { opacity:1; }

/* BOUQUET */
.bouquet-section {
  background:linear-gradient(135deg,#fce7f3 0%,#ede9fe 100%);
}
.bouquet-wrap { display:flex; justify-content:center; }
.bouquet-frame { position:relative; display:inline-block; }
.bouquet-svg-wrap {
  width:360px; max-width:88vw; height:440px;
  border-radius:50% 50% 30px 30px / 45% 45% 30px 30px;
  overflow:hidden;
  box-shadow:
    0 25px 70px rgba(124,58,237,0.18),
    0 0 0 8px rgba(249,168,212,0.25),
    0 0 0 16px rgba(167,139,250,0.12);
  background:#fff5f8;
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  display:flex; align-items:center; justify-content:center;
}
.bouquet-svg-wrap:hover { transform:scale(1.03) translateY(-6px); }
.bouquet-ribbon {
  position:absolute; bottom:-20px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,var(--violet),var(--sakura-deep));
  color:white; font-family:'Cormorant Garamond',serif;
  font-style:italic; font-size:1rem;
  padding:10px 30px; border-radius:100px; white-space:nowrap;
  box-shadow:0 8px 24px rgba(124,58,237,0.3);
}

/* GALLERY */
.gallery-section { background:var(--cream); }
.gallery-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:26px; max-width:860px; margin:0 auto;
}
.flower-card {
  background:white; border-radius:24px; overflow:hidden;
  box-shadow:0 4px 20px rgba(124,58,237,0.08);
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
}
.flower-card:hover {
  transform:translateY(-10px);
  box-shadow:0 20px 50px rgba(124,58,237,0.16);
}
.flower-card-art {
  width:100%; height:220px;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.flower-card-body { padding:20px 22px 24px; }
.flower-card h3 {
  font-family:'Cormorant Garamond',serif;
  font-size:1.45rem; font-weight:400; font-style:italic;
  color:var(--text-dark); margin-bottom:7px;
}
.flower-card p {
  font-size:0.88rem; font-weight:300;
  color:var(--text-mid); line-height:1.65;
}
.flower-pip {
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:linear-gradient(135deg,var(--violet-light),var(--sakura));
  margin-bottom:9px;
}

/* REASONS */
.reasons-section { background:linear-gradient(160deg,#ede9fe 0%,#fce7f3 100%); }
.reasons-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:18px; max-width:900px; margin:0 auto;
}
.reason-card {
  background:white; border-radius:20px; padding:26px 24px;
  position:relative; overflow:hidden;
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
  border:1px solid rgba(167,139,250,0.14);
}
.reason-card::before {
  content:''; position:absolute; top:0; left:0;
  width:4px; height:100%;
  background:linear-gradient(to bottom,var(--violet-light),var(--sakura));
  border-radius:4px 0 0 4px;
}
.reason-card:hover { transform:translateY(-6px); box-shadow:0 16px 40px rgba(124,58,237,0.12); }
.reason-icon { font-size:1.5rem; margin-bottom:11px; display:block; }
.reason-card p { font-size:0.93rem; color:var(--text-dark); line-height:1.72; }

/* FUTURE */
.future-section { background:var(--cream); }
.future-list { display:flex; flex-direction:column; gap:14px; max-width:600px; margin:0 auto; }
.future-item {
  background:white; border-radius:16px; padding:20px 26px;
  display:flex; align-items:center; gap:15px;
  font-size:0.97rem; color:var(--text-dark);
  box-shadow:0 4px 16px rgba(124,58,237,0.07);
  border:1px solid rgba(167,139,250,0.12);
  transition:transform 0.3s ease, box-shadow 0.3s ease;
  cursor:pointer; position:relative; overflow:hidden;
}
.future-item::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(167,139,250,0.06),rgba(249,168,212,0.06));
  opacity:0; transition:opacity 0.3s ease;
}
.future-item:hover { transform:translateX(8px); box-shadow:0 10px 28px rgba(124,58,237,0.14); }
.future-item:hover::after { opacity:1; }
.future-dot {
  width:34px; height:34px; border-radius:50%;
  background:linear-gradient(135deg,var(--violet-light),var(--sakura));
  display:flex; align-items:center; justify-content:center;
  font-size:0.95rem; flex-shrink:0;
}

/* ENVELOPE */
.envelope-section {
  background:linear-gradient(160deg,#fce7f3,#ede9fe);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:70vh;
}
.envelope-wrap { display:flex; flex-direction:column; align-items:center; gap:12px; }
.env-hint { font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--violet-light); }
.envelope { width:340px; height:230px; position:relative; cursor:pointer; }
.env-body {
  width:100%; height:100%;
  background:linear-gradient(145deg,#e9d5ff,#d8b4fe);
  border-radius:12px;
  box-shadow:0 20px 60px rgba(124,58,237,0.2);
  position:relative; overflow:hidden;
}
.env-body::before {
  content:''; position:absolute; bottom:0; left:0; width:100%; height:50%;
  background:
    linear-gradient(135deg,transparent 49%,rgba(167,139,250,0.25) 50%),
    linear-gradient(225deg,transparent 49%,rgba(167,139,250,0.25) 50%);
  background-size:50% 100%; background-repeat:no-repeat;
  background-position:left bottom,right bottom;
}
.env-flap {
  position:absolute; top:0; left:0; width:100%; height:55%;
  background:linear-gradient(160deg,#c4b5fd,#a78bfa);
  clip-path:polygon(0 0,50% 65%,100% 0);
  transform-origin:top center;
  transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);
  z-index:3;
}
.env-letter {
  position:absolute; width:88%; background:white; border-radius:10px;
  left:6%; bottom:-100%; padding:20px 22px; text-align:center;
  transition:bottom 0.6s cubic-bezier(0.4,0,0.2,1) 0.2s;
  z-index:2; box-shadow:0 -4px 20px rgba(0,0,0,0.06);
}
.env-letter p {
  font-family:'Cormorant Garamond',serif; font-size:1rem;
  font-style:italic; color:var(--text-mid); line-height:1.7; margin-bottom:8px;
}
.env-letter p:last-child { margin-bottom:0; }
.envelope.open .env-flap { transform:rotateX(180deg); }
.envelope.open .env-letter { bottom:20px; }

/* FINAL */
.final-section { background:linear-gradient(160deg,#ede9fe 0%,#fce7f3 60%,var(--cream) 100%); }
.letter-card {
  max-width:660px; margin:0 auto; background:white;
  border-radius:32px; padding:56px 50px; text-align:center;
  box-shadow:0 25px 80px rgba(124,58,237,0.10),0 0 0 1px rgba(167,139,250,0.12);
  position:relative; overflow:hidden;
}
.letter-card::before {
  content:'💜'; position:absolute; top:-30px; right:-20px;
  font-size:8rem; opacity:0.04; transform:rotate(20deg);
}
.letter-card p {
  font-family:'Cormorant Garamond',serif; font-size:1.2rem;
  font-weight:300; color:var(--text-dark); line-height:1.95; margin-bottom:18px;
}
.letter-sig { font-family:'Cormorant Garamond',serif; font-size:2rem; color:var(--violet); margin-top:32px; display:block; }
.letter-divider {
  width:56px; height:2px;
  background:linear-gradient(to right,var(--violet-light),var(--sakura));
  margin:24px auto; border-radius:2px;
}
footer { text-align:center; padding:28px; font-size:0.78rem; font-weight:300; color:var(--violet-light); letter-spacing:0.1em; }

@media(max-width:600px){
  section{padding:65px 6%;}
  .flower-stem-wrap{width:140px;height:200px;}
  .flower-field-item:nth-child(2) .flower-stem-wrap{width:170px;height:240px;}
  .bouquet-svg-wrap{height:340px;}
  .letter-card{padding:38px 24px;}
  .nav-dots{display:none;}
  .envelope{width:300px;height:200px;}
}
</style>
</head>
<body>

<div class="petal-canvas" id="petalCanvas"></div>

<nav class="nav-dots" id="navDots">
  <div class="nav-dot active" data-section="0"></div>
  <div class="nav-dot" data-section="1"></div>
  <div class="nav-dot" data-section="2"></div>
  <div class="nav-dot" data-section="3"></div>
  <div class="nav-dot" data-section="4"></div>
  <div class="nav-dot" data-section="5"></div>
  <div class="nav-dot" data-section="6"></div>
  <div class="nav-dot" data-section="7"></div>
</nav>

<!-- HERO -->
<section class="hero" id="s0">
  <div class="hero-badge reveal"></div>
  <h1 class="reveal">For My<br><span>Favourite</span> Person</h1>
  <p class="hero-sub reveal">Since I can't hand you flowers today,<br>I figured I'd build you a garden instead.</p>
  <div class="scroll-hint reveal"><span>Scroll down</span><div class="scroll-line"></div></div>
</section>

<!-- LILY OF THE VALLEY -->
<section class="lily-section" id="s1">
  <p class="section-label reveal">Your favourite</p>
  <h2 class="reveal">Lily of the Valley</h2>
  <p class="subtitle reveal">Your favourite flowers got their own field. Poisonous or not, still beautiful just like you when you're being... well you</p>
  <div class="flower-field">

    <!-- Lily 1 -->
    <div class="flower-field-item reveal">
      <div class="flower-stem-wrap">
        <svg viewBox="0 0 180 260" class="flower-illustration" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bg1" cx="50%" cy="50%"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/></radialGradient>
            <radialGradient id="bell1" cx="50%" cy="30%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f0e6ff"/></radialGradient>
          </defs>
          <rect width="180" height="260" fill="url(#bg1)"/>
          <!-- stem -->
          <path d="M90,250 Q88,180 92,140 Q96,100 88,60" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- leaves -->
          <path d="M90,200 Q60,175 45,155 Q70,160 90,180" fill="#86efac" opacity="0.85"/>
          <path d="M90,200 Q120,178 135,158 Q112,162 90,180" fill="#4ade80" opacity="0.75"/>
          <!-- bell flowers on arching stem -->
          <path d="M88,60 Q110,55 120,70 Q115,90 105,100 Q100,85 95,80" stroke="#86efac" stroke-width="2" fill="none"/>
          <!-- bells -->
          <ellipse cx="120" cy="72" rx="11" ry="13" fill="url(#bell1)" stroke="#e9d5ff" stroke-width="1.5" transform="rotate(15,120,72)"/>
          <ellipse cx="113" cy="87" rx="10" ry="12" fill="url(#bell1)" stroke="#e9d5ff" stroke-width="1.5" transform="rotate(10,113,87)"/>
          <ellipse cx="105" cy="100" rx="10" ry="12" fill="url(#bell1)" stroke="#e9d5ff" stroke-width="1.5" transform="rotate(5,105,100)"/>
          <ellipse cx="97" cy="112" rx="9" ry="11" fill="url(#bell1)" stroke="#e9d5ff" stroke-width="1.5"/>
          <!-- second branch -->
          <path d="M90,80 Q68,72 58,85 Q63,100 70,108" stroke="#86efac" stroke-width="2" fill="none"/>
          <ellipse cx="57" cy="87" rx="10" ry="12" fill="url(#bell1)" stroke="#e9d5ff" stroke-width="1.5" transform="rotate(-12,57,87)"/>
          <ellipse cx="64" cy="100" rx="10" ry="12" fill="url(#bell1)" stroke="#e9d5ff" stroke-width="1.5" transform="rotate(-8,64,100)"/>
          <ellipse cx="71" cy="110" rx="9" ry="11" fill="url(#bell1)" stroke="#e9d5ff" stroke-width="1.5" transform="rotate(-4,71,110)"/>
          <!-- dots inside bells -->
          <circle cx="120" cy="76" r="2" fill="#c4b5fd" opacity="0.6"/>
          <circle cx="113" cy="91" r="2" fill="#c4b5fd" opacity="0.6"/>
          <circle cx="57" cy="91" r="2" fill="#c4b5fd" opacity="0.6"/>
        </svg>
      </div>
      <span class="flower-tag"></span>
    </div>

    <!-- Lily 2 (taller, centre) -->
    <div class="flower-field-item reveal">
      <div class="flower-stem-wrap">
        <svg viewBox="0 0 220 300" class="flower-illustration" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bg2" cx="50%" cy="50%"><stop offset="0%" stop-color="#f5f3ff"/><stop offset="100%" stop-color="#ede9fe"/></radialGradient>
            <radialGradient id="bell2" cx="50%" cy="25%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ede9fe"/></radialGradient>
          </defs>
          <rect width="220" height="300" fill="url(#bg2)"/>
          <path d="M110,290 Q108,210 112,165 Q116,120 108,70" stroke="#4ade80" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M110,235 Q72,205 52,180 Q82,186 110,215" fill="#86efac" opacity="0.9"/>
          <path d="M110,235 Q148,208 168,183 Q140,188 110,215" fill="#4ade80" opacity="0.8"/>
          <!-- main arching stem right -->
          <path d="M108,70 Q136,62 148,80 Q143,110 130,125" stroke="#86efac" stroke-width="2" fill="none"/>
          <ellipse cx="149" cy="83" rx="12" ry="14" fill="url(#bell2)" stroke="#ddd6fe" stroke-width="1.5" transform="rotate(18,149,83)"/>
          <ellipse cx="141" cy="100" rx="11" ry="13" fill="url(#bell2)" stroke="#ddd6fe" stroke-width="1.5" transform="rotate(12,141,100)"/>
          <ellipse cx="132" cy="114" rx="10" ry="12" fill="url(#bell2)" stroke="#ddd6fe" stroke-width="1.5" transform="rotate(6,132,114)"/>
          <ellipse cx="122" cy="126" rx="10" ry="12" fill="url(#bell2)" stroke="#ddd6fe" stroke-width="1.5"/>
          <!-- left stem -->
          <path d="M108,70 Q82,60 70,76 Q74,100 83,115" stroke="#86efac" stroke-width="2" fill="none"/>
          <ellipse cx="69" cy="78" rx="11" ry="13" fill="url(#bell2)" stroke="#ddd6fe" stroke-width="1.5" transform="rotate(-15,69,78)"/>
          <ellipse cx="76" cy="95" rx="11" ry="13" fill="url(#bell2)" stroke="#ddd6fe" stroke-width="1.5" transform="rotate(-9,76,95)"/>
          <ellipse cx="83" cy="110" rx="10" ry="12" fill="url(#bell2)" stroke="#ddd6fe" stroke-width="1.5" transform="rotate(-4,83,110)"/>
          <ellipse cx="90" cy="123" rx="10" ry="11" fill="url(#bell2)" stroke="#ddd6fe" stroke-width="1.5"/>
          <!-- dots -->
          <circle cx="149" cy="88" r="2.5" fill="#a78bfa" opacity="0.5"/>
          <circle cx="69" cy="83" r="2.5" fill="#a78bfa" opacity="0.5"/>
          <circle cx="141" cy="105" r="2" fill="#c4b5fd" opacity="0.5"/>
        </svg>
      </div>
      <span class="flower-tag"></span>
    </div>

    <!-- Lily 3 -->
    <div class="flower-field-item reveal">
      <div class="flower-stem-wrap">
        <svg viewBox="0 0 180 260" class="flower-illustration" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bg3" cx="50%" cy="50%"><stop offset="0%" stop-color="#fdf4ff"/><stop offset="100%" stop-color="#fce7f3"/></radialGradient>
            <radialGradient id="bell3" cx="50%" cy="25%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fce7f3"/></radialGradient>
          </defs>
          <rect width="180" height="260" fill="url(#bg3)"/>
          <path d="M90,250 Q88,185 91,148 Q94,110 87,68" stroke
